            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><b>الشرح:</b> البدء في شيء ما.<br>أيضًا رفع شيء ما. (فعل)<br><b>مرادف:</b> يبدأ، يرفع.<br><b>مضاد:</b> ينهي، يوقف.<br><b>مثال:</b> 1. نعتزم <b>بدء</b> المباراة الآن. 2. سيقوم بـ <b>رفع</b> الكأس.</div>",
            "da": "<b>Danska (Dansk):</b><br><b>Forklaring:</b> At begynde på noget.<br>Også at løfte noget. (udsagnsord)<br><b>Synonymer:</b> begynde, starte, løfte.<br><b>Antonymer:</b> afslutte, ende, stoppe.<br><b>Eksempler:</b> 1. Vi har tænkt os at <b>begynde</b> kampen nu. 2. Han vil <b>løfte</b> pokalen.",
            "et": "<b>Eistneska (Eesti):</b><br><b>Selgitus:</b> Millegagi alustada.<br>Või midagi üles tõsta. (tegusõna)<br><b>Sünonüümid:</b> alustama, algama, tõstma.<br><b>Antonüümid:</b> lõpetama, peatama.<br><b>Näited:</b> 1. Me kavatseme mängu <b>alustada</b> nüüd. 2. Ta kavatseb karika üles <b>tõsta</b>.",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> To begin something.<br>Also to lift something up. (verb)<br><b>Synonyms:</b> begin, start, lift, raise.<br><b>Antonyms:</b> end, finish, stop.<br><b>Examples:</b> 1. We intend to <b>begin</b> the game now. 2. He is going to <b>raise</b> the cup.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Simulan ang isang bagay.<br>Pati na rin itaas ang isang bagay. (pandiwa)<br><b>Kasingkahulugan:</b> simulan, umpisahan, itaas.<br><b>Kasalungat:</b> tapusin, ihinto.<br><b>Halimbawa:</b> 1. Plano nating <b>simulan</b> ang laro ngayon. 2. <b>Itaas</b> niya ang tropeo.",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Commencer quelque chose.<br>Aussi soulever quelque chose. (verbe)<br><b>Synonymes:</b> commencer, débuter, lever.<br><b>Antonymes:</b> finir, terminer, arrêter.<br><b>Exemples:</b> 1. Nous avons l'intention de <b>commencer</b> le jeu maintenant. 2. Il va <b>lever</b> la coupe.",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Iniziare qualcosa.<br>Oppure sollevare qualcosa. (verbo)<br><b>Sinonimi:</b> iniziare, avviare, sollevare.<br><b>Antonimi:</b> finire, terminare, fermare.<br><b>Esempi:</b> 1. Abbiamo intenzione di <b>iniziare</b> il gioco ora. 2. Ha intenzione di <b>sollevare</b> la coppa.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 开始某事。<br>或举起某物。 (动词)<br><b>同义词:</b> 开始, 举起。<br><b>反义词:</b> 结束, 停止。<br><b>例句:</b> 1. 我们打算现在<b>开始</b>比赛。2. 他打算<b>举起</b>奖杯。",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Destpêkirina tiştekî.<br>An jî bilindkirina tiştekî. (lêker)<br><b>Hevwate:</b> dest pê kirin, destpêkirin, bilind kirin.<br><b>Dijwate:</b> qedandin, bi dawî kirin.<br><b>Mînak:</b> 1. Em ê niha lîstikê <b>dest pê bikin</b>. 2. Ew ê kûpa <b>bilind bike</b>.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Sākt kaut ko.<br>Vai pacelt kaut ko. (darbības vārds)<br><b>Sinonīmi:</b> sākt, uzsākt, pacelt.<br><b>Antonīmi:</b> beigt, pabeigt.<br><b>Piemēri:</b> 1. Mēs tagad <b>sāksim</b> spēli. 2. Viņš grasās <b>pacelt</b> kausu.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Pradėti kažką.<br>Arba pakelti. (veiksmažodis)<br><b>Sinonimai:</b> pradėti, pakelti.<br><b>Antonimai:</b> baigti, sustabdyti.<br><b>Pavyzdžiai:</b> 1. Mes ketiname <b>pradėti</b> žaidimą dabar. 2. Jis ketina <b>pakelti</b> taurę.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Å begynne på noe.<br>Også å løfte noe opp. (verb)<br><b>Synonymer:</b> begynne, starte, løfte.<br><b>Antonymer:</b> avslutte, ende, stoppe.<br><b>Eksempler:</b> 1. Vi skal <b>begynne</b> kampen nå. 2. Han skal <b>heve</b> pokalen.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> شروع کردن چیزی.<br>همچنین بلند کردن چیزی. (فعل)<br><b>مترادف:</b> شروع کردن، آغاز کردن، بلند کردن.<br><b>متضاد:</b> تمام کردن، پایان دادن.<br><b>مثال:</b> 1. ما قصد داریم بازی را الان <b>شروع کنیم</b>. 2. او قصد دارد جام را <b>بالا ببرد</b>.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Começar algo.<br>Também levantar algo. (verbo)<br><b>Sinônimos:</b> começar, iniciar, levantar.<br><b>Antônimos:</b> terminar, acabar.<br><b>Exemplos:</b> 1. Vamos <b>começar</b> o jogo agora. 2. Ele vai <b>levantar</b> a taça.",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Começar algo.<br>Também levantar algo. (verbo)<br><b>Sinônimos:</b> começar, iniciar, levantar.<br><b>Antônimos:</b> terminar, parar.<br><b>Exemplos:</b> 1. Vamos <b>começar</b> o jogo agora. 2. Ele vai <b>erguer</b> a taça.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Rozpocząć coś.<br>Może też oznaczać podnieść coś do góry. (czasownik)<br><b>Synonimy:</b> zacząć, rozpocząć, podnieść.<br><b>Antonimy:</b> skończyć, zakończyć, przerwać.<br><b>Przykłady:</b> 1. Zamierzamy <b>rozpocząć</b> grę teraz. 2. On zamierza <b>podnieść</b> puchar.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> A începe ceva.<br>De asemenea, a ridica ceva. (verb)<br><b>Sinonime:</b> a începe, a iniția, a ridica.<br><b>Antonime:</b> a termina, a sfârși.<br><b>Exemple:</b> 1. Vom <b>începe</b> jocul acum. 2. El va <b>ridica</b> cupa.",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> Начать что-то.<br>Либо поднять что-то вверх. (глагол)<br><b>Синонимы:</b> начать, начинать, поднять.<br><b>Антонимы:</b> закончить, завершить.<br><b>Примеры:</b> 1. Мы намерены <b>начать</b> игру сейчас. 2. Он собирается <b>поднять</b> кубок.",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Comenzar algo.<br>También levantar algo. (verbo)<br><b>Sinónimos:</b> comenzar, iniciar, levantar.<br><b>Antónimos:</b> terminar, finalizar, parar.<br><b>Ejemplos:</b> 1. Vamos a <b>comenzar</b> el juego ahora. 2. Él va a <b>levantar</b> la copa.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Att börja med något.<br>Eller att lyfta upp något. (verb)<br><b>Synonymer:</b> börja, starta, lyfta.<br><b>Antonymer:</b> sluta, avsluta.<br><b>Exempel:</b> 1. Vi ska <b>börja</b> spelet nu. 2. Han tänker <b>lyfta</b> pokalen.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> เริ่มต้นบางสิ่ง<br>หรือยกบางสิ่งขึ้น (คำกริยา)<br><b>คำพ้องความหมาย:</b> เริ่มต้น, เริ่ม, ยก<br><b>คำตรงข้าม:</b> จบ, สิ้นสุด, หยุด<br><b>ตัวอย่าง:</b> 1. เราตั้งใจจะ<b>เริ่ม</b>เกมเดี๋ยวนี้ 2. เขาตั้งใจจะ<b>ยก</b>ถ้วยรางวัล",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Почати щось.<br>Або підняти щось вгору. (дієслово)<br><b>Синоніми:</b> почати, розпочати, підняти.<br><b>Антоніми:</b> закінчити, завершити.<br><b>Приклади:</b> 1. Ми збираємося <b>розпочати</b> гру зараз. 2. Він збирається <b>підняти</b> кубок.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Bắt đầu một cái gì đó.<br>Hoặc nâng một cái gì đó lên. (động từ)<br><b>Từ đồng nghĩa:</b> bắt đầu, khởi đầu, nâng lên.<br><b>Từ trái nghĩa:</b> kết thúc, dừng lại.<br><b>Ví dụ:</b> 1. Chúng tôi dự định <b>bắt đầu</b> trò chơi ngay bây giờ. 2. Anh ấy dự định <b>nâng</b> chiếc cúp.",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Mit etwas beginnen.<br>Oder etwas anheben. (Verb)<br><b>Synonyme:</b> beginnen, anfangen, heben.<br><b>Antonyme:</b> beenden, aufhören.<br><b>Beispiele:</b> 1. Wir werden das Spiel jetzt <b>beginnen</b>. 2. Er wird den Pokal <b>heben</b>."
        }
    },
    { 
        text: "svið", 
        is_exp: "<b>Útskýring:</b> Staður þar sem leikarar sýna (leiksvið).<br>Einnig ákveðið fag eða vettvangur (t.d. fræðasvið).<br>Þýðir líka brenndur og soðinn sauðahaus (matur). (nafnorð)<br><b>Samheiti:</b> vettvangur, pallur, geiri.<br><b>Dæmi:</b> 1. Þetta er stórt <b>svið</b>. 2. Læknisfræði er spennandi <b>svið</b>. 3. Hann ætlar að borða <b>svið</b>.",
        translations: {
            "sq": "<b>Albanska (Shqip):</b><br><b>Shpjegimi:</b> Skenë (në teatër).<br>Ose një fushë e caktuar (p.sh. studimi).<br>Të kuptosh edhe ushqim tradicional. (emër)<br><b>Sinonimet:</b> skenë, fushë, sektor.<br><b>Shembuj:</b> 1. Kjo është një <b>skenë</b> e madhe. 2. Mjekësia është një <b>fushë</b> emocionuese. 3. Ai do të hajë <b>kokë deleje</b>.",
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><b>الشرح:</b> مسرح (للتمثيل).<br>أو مجال/تخصص معين.<br>أيضًا طعام تقليدي (رأس الغنم). (اسم)<br><b>مرادف:</b> مسرح، مجال، ميدان.<br><b>مثال:</b> 1. هذا <b>مسرح</b> كبير. 2. الطب <b>مجال</b> مثير. 3. سوف يأكل <b>رأس غنم</b>.</div>",
            "da": "<b>Danska (Dansk):</b><br><b>Forklaring:</b> Scene (i et teater).<br>Eller et bestemt felt/område.<br>Også traditionel mad (svidehoved). (navneord)<br><b>Synonymer:</b> scene, felt, område.<br><b>Eksempler:</b> 1. Dette er en stor <b>scene</b>. 2. Medicin er et spændende <b>felt</b>. 3. Han vil spise <b>svidehoved</b>.",
            "et": "<b>Eistneska (Eesti):</b><br><b>Selgitus:</b> Lava (teatris).<br>Või teatud valdkond/eriala.<br>Ka traditsiooniline toit. (nimisõna)<br><b>Sünonüümid:</b> lava, valdkond, ala.<br><b>Näited:</b> 1. See on suur <b>lava</b>. 2. Meditsiin on põnev <b>valdkond</b>. 3. Ta kavatseb süüa <b>lambapead</b>.",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> A stage (in a theater).<br>Also a specific field or domain.<br>Also a traditional food (singed sheep head). (noun)<br><b>Synonyms:</b> stage, field, domain, area.<br><b>Examples:</b> 1. This is a big <b>stage</b>. 2. Medicine is an exciting <b>field</b>. 3. He is going to eat <b>sheep's head</b>.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Entablado (sa teatro).<br>O isang partikular na larangan/sektor.<br>Pati na rin tradisyonal na pagkain. (pangngalan)<br><b>Kasingkahulugan:</b> entablado, larangan, saklaw.<br><b>Halimbawa:</b> 1. Ito ay isang malaking <b>entablado</b>. 2. Ang medisina ay isang kapana-panabik na <b>larangan</b>. 3. Kakain siya ng <b>ulo ng tupa</b>.",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Une scène (au théâtre).<br>Ou un domaine spécifique.<br>Aussi une nourriture traditionnelle (tête de mouton). (nom)<br><b>Synonymes:</b> scène, domaine, secteur.<br><b>Exemples:</b> 1. C'est une grande <b>scène</b>. 2. La médecine est un <b>domaine</b> passionnant. 3. Il va manger une <b>tête de mouton</b>.",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Un palcoscenico (a teatro).<br>O un campo/settore specifico.<br>Anche un cibo tradizionale. (sostantivo)<br><b>Sinonimi:</b> palcoscenico, campo, settore.<br><b>Esempi:</b> 1. Questo è un grande <b>palcoscenico</b>. 2. La medicina è un <b>campo</b> entusiasmante. 3. Lui mangerà una <b>testa di pecora</b>.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 舞台（剧院）。<br>或特定领域。<br>也是一种传统食物（熏羊头）。 (名词)<br><b>同义词:</b> 舞台, 领域, 范围。<br><b>例句:</b> 1. 这是一个大<b>舞台</b>。2. 医学是一个令人兴奋的<b>领域</b>。3. 他要吃<b>羊头</b>。",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Qonax/sehnê (li şanoyê).<br>An jî qadek/bwarek diyar.<br>Her weha xwarinek kevneşopî ye. (navdêr)<br><b>Hevwate:</b> sehnê, qad, bwar.<br><b>Mînak:</b> 1. Ev <b>dîk</b>ek mezin e. 2. Bijîşkî <b>qad</b>ek heyecan e. 3. Ew ê <b>seriyê pez</b> bixwe.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Skatuve (teātrī).<br>Vai noteikta joma/lauks.<br>Arī tradicionāls ēdiens. (lietvārds)<br><b>Sinonīmi:</b> skatuve, joma, sfēra.<br><b>Piemēri:</b> 1. Šī ir liela <b>skatuve</b>. 2. Medicīna ir aizraujoša <b>joma</b>. 3. Viņš ēdīs <b>aitas galvu</b>.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Scena (teatre).<br>Arba tam tikra sritis.<br>Taip pat tradicinis maistas. (daiktavardis)<br><b>Sinonimai:</b> scena, sritis, laukas.<br><b>Pavyzdžiai:</b> 1. Tai yra didelė <b>scena</b>. 2. Medicina yra jaudinanti <b>sritis</b>. 3. Jis valgys <b>avies galvą</b>.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Scene (i et teater).<br>Eller et bestemt felt/område.<br>Også tradisjonell mat (smalahove). (substantiv)<br><b>Synonymer:</b> scene, felt, område.<br><b>Eksempler:</b> 1. Dette er en stor <b>scene</b>. 2. Medisin er et spennende <b>felt</b>. 3. Han skal spise <b>smalahove</b>.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> صحنه (در تئاتر).<br>یا یک زمینه/حوزه خاص.<br>همچنین یک غذای سنتی (کله گوسفند). (اسم)<br><b>مترادف:</b> صحنه، زمینه، حوزه.<br><b>مثال:</b> 1. این یک <b>صحنه</b> بزرگ است. 2. پزشکی یک <b>زمینه</b> هیجان‌انگیز است. 3. او می‌خواهد <b>کله گوسفند</b> بخورد.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Um palco (num teatro).<br>Ou um campo/área específica.<br>Também um alimento tradicional (cabeça de ovelha). (substantivo)<br><b>Sinônimos:</b> palco, campo, área.<br><b>Exemplos:</b> 1. Este é um grande <b>palco</b>. 2. A medicina é uma <b>área</b> excitante. 3. Ele vai comer <b>cabeça de ovelha</b>.",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Um palco (no teatro).<br>Ou um campo/área específica.<br>Também uma comida tradicional. (substantivo)<br><b>Sinônimos:</b> palco, campo, área.<br><b>Exemplos:</b> 1. Este é um grande <b>palco</b>. 2. A medicina é uma <b>área</b> empolgante. 3. Ele vai comer <b>cabeça de ovelha</b>.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Scena (w teatrze).<br>Lub określona dziedzina/obszar.<br>Także tradycyjne jedzenie. (rzeczownik)<br><b>Synonimy:</b> scena, dziedzina, pole.<br><b>Przykłady:</b> 1. To jest duża <b>scena</b>. 2. Medycyna to ekscytująca <b>dziedzina</b>. 3. On zamierza zjeść <b>barani łeb</b>.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> O scenă (la teatru).<br>Sau un domeniu/câmp specific.<br>De asemenea, mâncare tradițională. (substantiv)<br><b>Sinonime:</b> scenă, domeniu, câmp.<br><b>Exemple:</b> 1. Aceasta este o <b>scenă</b> mare. 2. Medicina este un <b>domeniu</b> captivant. 3. Va mânca un <b>cap de oaie</b>.",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> Сцена (в театре).<br>Или определенная сфера/область.<br>Также традиционная еда. (существительное)<br><b>Синонимы:</b> сцена, сфера, область.<br><b>Примеры:</b> 1. Это большая <b>сцена</b>. 2. Медицина — это увлекательная <b>сфера</b>. 3. Он собирается съесть <b>овечью голову</b>.",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Un escenario (en un teatro).<br>O un campo/área específica.<br>También comida tradicional (cabeza de oveja). (sustantivo)<br><b>Sinónimos:</b> escenario, campo, área.<br><b>Ejemplos:</b> 1. Este es un gran <b>escenario</b>. 2. La medicina es un <b>campo</b> emocionante. 3. Él va a comer <b>cabeza de oveja</b>.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Scen (i teater).<br>Eller ett specifikt fält/område.<br>Även traditionell mat. (substantiv)<br><b>Synonymer:</b> scen, fält, område.<br><b>Exempel:</b> 1. Detta är en stor <b>scen</b>. 2. Medicin är ett spännande <b>område</b>. 3. Han ska äta <b>fårhuvud</b>.",

            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Encontrar el tamaño/longitud (medir).<br>También recomendar. (verbo)<br><b>Sinónimos:</b> medir, evaluar, recomendar.<br><b>Ejemplos:</b> 1. El médico va a <b>medir</b> la presión arterial. 2. Quiero <b>recomendar</b> este libro.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Att hitta storlek/längd (mäta).<br>Eller att rekommendera. (verb)<br><b>Synonymer:</b> mäta, bedöma, rekommendera.<br><b>Exempel:</b> 1. Läkaren ska <b>mäta</b> blodtrycket. 2. Jag vill <b>rekommendera</b> den här boken.",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> เพื่อหาขนาด ความยาว หรือน้ำหนัก (วัด)<br>หรือเพื่อให้คำแนะนำ (คำกริยา)<br><b>คำพ้องความหมาย:</b> วัด, ประเมิน, แนะนำ<br><b>ตัวอย่าง:</b> 1. หมอกำลังจะ<b>วัด</b>ความดันเลือด 2. ฉันอยาก<b>แนะนำ</b>หนังสือเล่มนี้",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Дізнатися розмір/довжину (виміряти).<br>Або рекомендувати. (дієслово)<br><b>Синоніми:</b> вимірювати, оцінювати, рекомендувати.<br><b>Приклади:</b> 1. Лікар збирається <b>виміряти</b> тиск. 2. Я хочу <b>порекомендувати</b> цю книгу.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Tìm ra kích thước/chiều dài (đo lường).<br>Hoặc giới thiệu. (động từ)<br><b>Từ đồng nghĩa:</b> đo, đánh giá, giới thiệu.<br><b>Ví dụ:</b> 1. Bác sĩ sẽ <b>đo</b> huyết áp. 2. Tôi muốn <b>giới thiệu</b> cuốn sách này.",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Größe/Länge herausfinden (messen).<br>Oder etwas empfehlen. (Verb)<br><b>Synonyme:</b> messen, wiegen, empfehlen.<br><b>Beispiele:</b> 1. Der Arzt wird den Blutdruck <b>messen</b>. 2. Ich möchte dieses Buch <b>empfehlen</b>."
        }
    }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Markorð - Lota 3 - A2.2</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="sq">Albanska – Shqip</option>
                <option value="ar">Arabíska – العربية</option>
                <option value="da">Danska – Dansk</option>
                <option value="et">Eistneska – Eesti</option>
                <option value="en" selected>Enska – English</option>
                <option value="tl">Filippseyska – Tagalog / Filipino</option>
                <option value="fr">Franska – Français</option>
                <option value="it">Ítalska – Italiano</option>
                <option value="zh">Kínverska – 中文</option>
                <option value="ku">Kúrdíska – Kurdî</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português (EU)</option>
                <option value="pt-BR">Portúgalska (Brasilía) – Português (BR)</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="es">Spænska – Español</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
                <option value="de">Þýska – Deutsch</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return;

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð - Lota 3 - A2.2', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
