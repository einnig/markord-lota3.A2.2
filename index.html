            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Labai daug, daugiau nei kiti, arba padaryta tam tikram tikslui. (prievezmis)<br><b>Sinonimai:</b> ypač, specialiai.<br><b>Antonimai:</b> apskritai, paprastai.<br><b>Pavyzdžiai:</b> 1. Tai <b>ypač</b> graži daina. 2. Iškepiau šį pyragą <b>specialiai</b> tau.",

            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Examiner de très près, distinguer des choses, ou rapporter. (verbe)<br><b>Synonymes:</b> analyser, examiner, distinguer, rapporter.<br><b>Exemples:</b> 1. Nous allons <b>analyser</b> les mots. 2. Je ne peux pas <b>distinguer</b> entre eux. 3. Les nouvelles ont <b>rapporté</b> l'accident.",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Esaminare qualcosa da vicino, distinguere tra cose o riferire. (verbo)<br><b>Sinonimi:</b> analizzare, distinguere, riportare.<br><b>Esempi:</b> 1. <b>Analizzeremo</b> le parole. 2. Non riesco a <b>distinguerli</b>. 3. Le notizie hanno <b>riportato</b> l'incidente.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 仔细检查（分析），区分事物，或报告。 (动词)<br><b>同义词:</b> 分析, 区分, 报告。<br><b>例句:</b> 1. 我们要<b>分析</b>这些单词。2. 我无法<b>区分</b>它们。3. 新闻<b>报道</b>了这起事故。",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Bi baldarî lêkolîn kirin, ji hev cuda kirin, an ragihandin. (lêker)<br><b>Hevwate:</b> analîz kirin, cuda kirin, ragihandin.<br><b>Mînak:</b> 1. Em ê peyvan <b>analîz bikin</b>. 2. Ez nikarim wan <b>ji hev cuda bikim</b>. 3. Nûçeyan qeza <b>ragihand</b>.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Rūpīgi pētīt, atšķirt vai ziņot. (darbības vārds)<br><b>Sinonīmi:</b> izpētīt, analizēt, atšķirt, ziņot.<br><b>Piemēri:</b> 1. Mēs <b>analizēsim</b> vārdus. 2. Es nespēju viņus <b>atšķirt</b>. 3. Ziņas <b>vēstīja</b> par negadījumu.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Atidžiai tirti, analizuoti, atskirti arba pranešti. (veiksmažodis)<br><b>Sinonimai:</b> analizuoti, atskirti, pranešti.<br><b>Pavyzdžiai:</b> 1. Mes <b>analizuosime</b> žodžius. 2. Aš negaliu jų <b>atskirti</b>. 3. Žinios <b>pranešė</b> apie avariją.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Å undersøke noe nøye, skille mellom ting, eller rapportere. (verb)<br><b>Synonymer:</b> analysere, studere, skille, rapportere.<br><b>Eksempler:</b> 1. Vi skal <b>analysere</b> ordene. 2. Jeg kan ikke <b>skille</b> mellom dem. 3. Nyhetene <b>rapporterte</b> om ulykken.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> بررسی دقیق، تشخیص دادن، یا گزارش دادن. (فعل)<br><b>مترادف:</b> تحلیل کردن، تشخیص دادن، گزارش دادن.<br><b>مثال:</b> 1. کلمات را <b>تحلیل</b> می‌کنیم. 2. نمی‌توانم بین آنها <b>تمایز</b> قائل شوم. 3. اخبار تصادف را <b>گزارش</b> داد.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Olhar de perto, analisar, distinguir, ou relatar. (verbo)<br><b>Sinônimos:</b> analisar, distinguir, relatar.<br><b>Exemplos:</b> 1. Vamos <b>analisar</b> as palavras. 2. Não consigo <b>distinguir</b> entre eles. 3. As notícias <b>relataram</b> o acidente.",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Olhar de perto, analisar, distinguir, ou relatar. (verbo)<br><b>Sinônimos:</b> analisar, distinguir, relatar.<br><b>Exemplos:</b> 1. Vamos <b>analisar</b> as palavras. 2. Não consigo <b>distinguir</b> entre eles. 3. As notícias <b>relataram</b> o acidente.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Badać coś uważnie (analizować), odróżniać, lub relacjonować. (czasownik)<br><b>Synonimy:</b> analizować, odróżniać, donosić.<br><b>Przykłady:</b> 1. <b>Przeanalizujemy</b> słowa. 2. Nie potrafię ich <b>odróżnić</b>. 3. Wiadomości <b>doniosły</b> o wypadku.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> A analiza atent, a distinge, sau a relata. (verb)<br><b>Sinonime:</b> a analiza, a distinge, a raporta.<br><b>Exemple:</b> 1. Vom <b>analiza</b> cuvintele. 2. Nu pot <b>distinge</b> între ei. 3. Știrile au <b>relatat</b> despre accident.",

            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Уважно розглядати (аналізувати), розрізняти, або повідомляти. (дієслово)<br><b>Синоніми:</b> аналізувати, розрізняти, повідомляти.<br><b>Приклади:</b> 1. Ми <b>проаналізуємо</b> слова. 2. Я не можу їх <b>розрізнити</b>. 3. Новини <b>повідомили</b> про аварію.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Phân tích kỹ, phân biệt, hoặc báo cáo. (động từ)<br><b>Từ đồng nghĩa:</b> phân tích, phân biệt, báo cáo.<br><b>Ví dụ:</b> 1. Chúng tôi sẽ <b>phân tích</b> các từ. 2. Tôi không thể <b>phân biệt</b> chúng. 3. Tin tức đã <b>đưa tin</b> về vụ tai nạn.",

            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Pagsamahin ang mga bagay, o iugnay ang sarili sa tao/ideya. (pandiwa)<br><b>Kasingkahulugan:</b> iugnay, ikonekta, makaugnay.<br><b>Kasalungat:</b> idiskonekta, paghiwalayin.<br><b>Halimbawa:</b> 1. <b>Ikonekta</b> ang computer. 2. Nahihirapan akong <b>makaugnay</b> sa aklat na ito.",

            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Collegare le cose in modo che funzionino, o relazionarsi. (verbo)<br><b>Sinonimi:</b> collegare, connettere, relazionarsi.<br><b>Antonimi:</b> disconnettere, separare.<br><b>Esempi:</b> 1. Vuoi <b>collegare</b> il computer? 2. Faccio fatica a <b>connettermi</b> con questo libro.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 把事物连接在一起，或与人/想法产生共鸣。 (动词)<br><b>同义词:</b> 连接, 联系, 共鸣。<br><b>反义词:</b> 断开, 分离。<br><b>例句:</b> 1. 你想<b>连接</b>电脑吗？ 2. 我很难对这本书产生<b>共鸣</b>。",

            "sq": "<b>Albanska (Shqip):</b><br><b>Shpjegimi:</b> Të bësh diçka më të mirë, të riparosh ose të shtosh. (folje)<br><b>Sinonimet:</b> riparoj, përmirësoj, shtoj.<br><b>Antonimet:</b> dëmtoj, përkeqësoj, pakësoj.<br><b>Shembuj:</b> 1. Ne do të përpiqemi të <b>përmirësohemi</b>. 2. A dëshiron të <b>shtosh</b> më shumë qumësht?",
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><b>الشرح:</b> جعل شيء ما أفضل، إصلاح، أو الإضافة إلى شيء. (فعل)<br><b>مرادف:</b> إصلاح، تحسين، إضافة.<br><b>مضاد:</b> إتلاف، تقليل.<br><b>مثال:</b> 1. سنحاول <b>تحسين</b> أنفسنا. 2. هل تريد <b>إضافة</b> المزيد من الحليب؟</div>",
            "da": "<b>Danska (Dansk):</b><br><b>Forklaring:</b> At gøre noget bedre, reparere, eller tilføje mere. (udsagnsord)<br><b>Synonymer:</b> reparere, forbedre, tilføje.<br><b>Antonymer:</b> ødelægge, forværre, mindske.<br><b>Eksempler:</b> 1. Vi vil forsøge at <b>forbedre</b> os. 2. Vil du <b>tilføje</b> mere mælk?",
            "et": "<b>Eistneska (Eesti):</b><br><b>Selgitus:</b> Midagi paremaks tegema, parandama või lisama. (tegusõna)<br><b>Sünonüümid:</b> parandama, täiustama, lisama.<br><b>Antonüümid:</b> kahjustama, halvendama, vähendama.<br><b>Näited:</b> 1. Me püüame end <b>parandada</b>. 2. Kas sa tahad <b>lisada</b> veel piima?",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> To make something better, repair, or to add more to something. (verb)<br><b>Synonyms:</b> fix, improve, add.<br><b>Antonyms:</b> damage, worsen, reduce.<br><b>Examples:</b> 1. We will try to <b>improve</b> ourselves. 2. Do you want to <b>add</b> more milk?",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Para mas pagandahin ang isang bagay, ayusin, o magdagdag. (pandiwa)<br><b>Kasingkahulugan:</b> ayusin, pagbutihin, idagdag.<br><b>Kasalungat:</b> sirain, palalain, bawasan.<br><b>Halimbawa:</b> 1. Susubukan nating <b>pagbutihin</b> ang ating sarili. 2. Gusto mo bang <b>magdagdag</b> ng gatas?",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Rendre quelque chose meilleur, réparer, ou ajouter. (verbe)<br><b>Synonymes:</b> réparer, améliorer, ajouter.<br><b>Antonymes:</b> abîmer, aggraver, réduire.<br><b>Exemples:</b> 1. Nous allons essayer de nous <b>améliorer</b>. 2. Veux-tu <b>ajouter</b> plus de lait ?",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Rendere qualcosa migliore, riparare o aggiungere di più. (verbo)<br><b>Sinonimi:</b> aggiustare, migliorare, aggiungere.<br><b>Antonimi:</b> danneggiare, peggiorare, ridurre.<br><b>Esempi:</b> 1. Cercheremo di <b>migliorare</b>. 2. Vuoi <b>aggiungere</b> altro latte?",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 使某事物变得更好，修理，或增加。 (动词)<br><b>同义词:</b> 修理, 改善, 增加。<br><b>反义词:</b> 损坏, 恶化, 减少。<br><b>例句:</b> 1. 我们会努力<b>提高</b>自己。2. 你想<b>多加</b>点牛奶吗？",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Tiştekî baştir kirin, çêkirin, an jî lê zêde kirin. (lêker)<br><b>Hevwate:</b> çêkirin, baştir kirin, zêde kirin.<br><b>Dijwate:</b> xera kirin, xirabtir kirin, kêm kirin.<br><b>Mînak:</b> 1. Em ê hewl bidin ku xwe <b>baştir bikin</b>. 2. Ma tu dixwazî ​​şîr <b>lê zêde bikî</b>?",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Padarīt kaut ko labāku, salabot vai pievienot vairāk. (darbības vārds)<br><b>Sinonīmi:</b> labot, uzlabot, pievienot.<br><b>Antonīmi:</b> sabojāt, pasliktināt, samazināt.<br><b>Piemēri:</b> 1. Mēs mēģināsim <b>uzlaboties</b>. 2. Vai vēlies <b>pievienot</b> pienu?",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Padaryti kažką geresnio, taisyti arba pridėti. (veiksmažodis)<br><b>Sinonimai:</b> taisyti, tobulinti, pridėti.<br><b>Antonimai:</b> sugadinti, pabloginti, sumažinti.<br><b>Pavyzdžiai:</b> 1. Mes bandysime <b>patobulėti</b>. 2. Ar nori <b>pridėti</b> daugiau pieno?",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Å gjøre noe bedre, reparere, eller legge til mer. (verb)<br><b>Synonymer:</b> fikse, forbedre, tilføye.<br><b>Antonymer:</b> ødelegge, forverre, minske.<br><b>Eksempler:</b> 1. Vi skal prøve å <b>forbedre</b> oss. 2. Vil du <b>tilføye</b> mer melk?",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> بهتر کردن چیزی، تعمیر کردن یا اضافه کردن. (فعل)<br><b>مترادف:</b> اصلاح کردن، بهبود بخشیدن، افزودن.<br><b>متضاد:</b> خراب کردن، بدتر کردن، کم کردن.<br><b>مثال:</b> 1. ما سعی می‌کنیم خودمان را <b>بهبود</b> بخشیم. 2. می‌خواهی شیر <b>اضافه</b> کنی؟</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Tornar algo melhor, consertar, ou adicionar mais. (verbo)<br><b>Sinônimos:</b> consertar, melhorar, adicionar.<br><b>Antônimos:</b> estragar, piorar, reduzir.<br><b>Exemplos:</b> 1. Vamos tentar nos <b>melhorar</b>. 2. Quer <b>adicionar</b> mais leite?",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Tornar algo melhor, consertar, ou adicionar mais. (verbo)<br><b>Sinônimos:</b> consertar, melhorar, adicionar.<br><b>Antônimos:</b> estragar, piorar, reduzir.<br><b>Exemplos:</b> 1. Vamos tentar nos <b>melhorar</b>. 2. Você quer <b>adicionar</b> mais leite?",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Zrobić coś lepiej, naprawić, lub dodać więcej. (czasownik)<br><b>Synonimy:</b> naprawić, poprawić, dodać.<br><b>Antonimy:</b> zepsuć, pogorszyć, zmniejszyć.<br><b>Przykłady:</b> 1. Postaramy się <b>poprawić</b>. 2. Czy chcesz <b>dodać</b> więcej mleka?",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> A face ceva mai bun, a repara, sau a adăuga mai mult. (verb)<br><b>Sinonime:</b> a repara, a îmbunătăți, a adăuga.<br><b>Antonime:</b> a strica, a înrăutăți, a reduce.<br><b>Exemple:</b> 1. Vom încerca să ne <b>îmbunătățim</b>. 2. Vrei să <b>adaugi</b> mai mult lapte?",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> Сделать что-то лучше, починить, или добавить. (глагол)<br><b>Синонимы:</b> исправить, улучшить, добавить.<br><b>Антонимы:</b> испортить, ухудшить, убавить.<br><b>Примеры:</b> 1. Мы постараемся стать <b>лучше</b>. 2. Хочешь <b>добавить</b> молока?",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Hacer algo mejor, arreglar, o añadir más a algo. (verbo)<br><b>Sinónimos:</b> arreglar, mejorar, añadir.<br><b>Antónimos:</b> dañar, empeorar, reducir.<br><b>Ejemplos:</b> 1. Vamos a intentar <b>mejorar</b>. 2. ¿Quieres <b>añadir</b> más leche?",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Att göra något bättre, laga, eller att lägga till mer. (verb)<br><b>Synonymer:</b> laga, förbättra, tillsätta.<br><b>Antonymer:</b> förstöra, försämra, minska.<br><b>Exempel:</b> 1. Vi ska försöka <b>förbättra</b> oss. 2. Vill du <b>lägga till</b> mer mjölk?",
            "th": "<b>Tælenska (ภาษาไทย):</b><br><b>คำอธิบาย:</b> ทำให้บางสิ่งดีขึ้น ซ่อมแซม หรือเพิ่มเข้าไป (คำกริยา)<br><b>คำพ้องความหมาย:</b> แก้ไข, ปรับปรุง, เพิ่มเติม<br><b>คำตรงข้าม:</b> ทำลาย, ทำให้แย่ลง, ลดลง<br><b>ตัวอย่าง:</b> 1. เราจะพยายาม<b>ปรับปรุง</b>ตัวเอง 2. คุณต้องการ<b>เติม</b>นมเพิ่มไหม?",
            "uk": "<b>Úkraínska (Українська):</b><br><b>Пояснення:</b> Зробити щось кращим, полагодити, або додати. (дієслово)<br><b>Синоніми:</b> виправити, покращити, додати.<br><b>Антоніми:</b> зіпсувати, погіршити, зменшити.<br><b>Приклади:</b> 1. Ми постараємося <b>покращити</b> себе. 2. Хочеш <b>додати</b> ще молока?",
            "vi": "<b>Víetnamska (Tiếng Việt):</b><br><b>Giải thích:</b> Làm cho tốt hơn, sửa chữa, hoặc thêm vào. (động từ)<br><b>Từ đồng nghĩa:</b> sửa chữa, cải thiện, thêm.<br><b>Từ trái nghĩa:</b> làm hỏng, làm xấu đi, giảm bớt.<br><b>Ví dụ:</b> 1. Chúng ta sẽ cố gắng <b>cải thiện</b>. 2. Bạn có muốn <b>thêm</b> sữa không?",
            "de": "<b>Þýska (Deutsch):</b><br><b>Erklärung:</b> Etwas besser machen, reparieren oder mehr hinzufügen. (Verb)<br><b>Synonyme:</b> reparieren, verbessern, hinzufügen.<br><b>Antonyme:</b> beschädigen, verschlechtern, verringern.<br><b>Beispiele:</b> 1. Wir werden versuchen, uns zu <b>verbessern</b>. 2. Willst du mehr Milch <b>hinzufügen</b>?"
        }
    },
    { 
        text: "almennur", 
        is_exp: "<b>Útskýring:</b> Eitthvað sem á við um allt fólk, er fyrir alla eða er mjög venjulegt. (lýsingarorð)<br><b>Samheiti:</b> venjulegur, algengur, opinber.<br><b>Andheiti:</b> sérstakur, óvenjulegur, einka.<br><b>Dæmi:</b> 1. Þetta er <b>almennur</b> (opinber) frídagur fyrir allt fólk. 2. Það er <b>almenn</b> (algeng) regla að mæta á réttum tíma.",
        translations: {
            "sq": "<b>Albanska (Shqip):</b><br><b>Shpjegimi:</b> Diçka që zbatohet për të gjithë, është publike ose shumë e zakonshme. (mbiemër)<br><b>Sinonimet:</b> i përgjithshëm, i zakonshëm, publik.<br><b>Antonimet:</b> i veçantë, privat.<br><b>Shembuj:</b> 1. Kjo është një festë <b>publike</b> për të gjithë. 2. Është një rregull i <b>përgjithshëm</b> të jesh në kohë.",
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b><br><b>الشرح:</b> شيء ينطبق على جميع الناس، متاح للجميع أو عادي جداً. (صفة)<br><b>مرادف:</b> عام، عادي، شائع.<br><b>مضاد:</b> خاص، غير عادي.<br><b>مثال:</b> 1. هذا يوم عطلة <b>عامة</b> للجميع. 2. إنها قاعدة <b>عامة</b> أن تحضر في الوقت المحدد.</div>",
            "da": "<b>Danska (Dansk):</b><br><b>Forklaring:</b> Noget der gælder alle mennesker, eller er meget normalt. (tillægsord)<br><b>Synonymer:</b> almindelig, generel, offentlig.<br><b>Antonymer:</b> speciel, usædvanlig, privat.<br><b>Eksempler:</b> 1. Dette er en <b>offentlig</b> fridag for alle. 2. Det er en <b>generel</b> regel at møde til tiden.",
            "et": "<b>Eistneska (Eesti):</b><br><b>Selgitus:</b> Miski, mis kehtib kõigile või on väga levinud. (omadussõna)<br><b>Sünonüümid:</b> ühine, üldine, avalik.<br><b>Antonüümid:</b> spetsiaalne, era-, ebatavaline.<br><b>Näited:</b> 1. See on <b>riigipüha</b> kõigile. 2. Õigeks ajaks jõudmine on <b>üldine</b> reegel.",
            "en": "<b>Enska (English):</b><br><b>Explanation:</b> Something that applies to all people, is for everyone, or is very common. (adjective)<br><b>Synonyms:</b> common, general, public.<br><b>Antonyms:</b> special, private, unusual.<br><b>Examples:</b> 1. This is a <b>public</b> holiday for everyone. 2. It's a <b>general</b> rule to be on time.",
            "tl": "<b>Filippseyska (Tagalog):</b><br><b>Paliwanag:</b> Bagay na naaangkop sa lahat ng tao, pampubliko, o karaniwan. (pang-uri)<br><b>Kasingkahulugan:</b> karaniwan, pangkalahatan, pampubliko.<br><b>Kasalungat:</b> espesyal, pribado.<br><b>Halimbawa:</b> 1. Ito ay isang <b>pampublikong</b> holiday. 2. <b>Karaniwang</b> panuntunan ang pumasok sa tamang oras.",
            "fr": "<b>Franska (Français):</b><br><b>Explication:</b> Quelque chose qui s'applique à tous, public, ou très commun. (adjectif)<br><b>Synonymes:</b> commun, général, public.<br><b>Antonymes:</b> spécial, privé, rare.<br><b>Exemples:</b> 1. C'est un jour férié <b>public</b> pour tous. 2. C'est une règle <b>générale</b> d'être à l'heure.",
            "it": "<b>Ítalska (Italiano):</b><br><b>Spiegazione:</b> Qualcosa che si applica a tutte le persone, pubblico o molto comune. (aggettivo)<br><b>Sinonimi:</b> comune, generale, pubblico.<br><b>Antonimi:</b> speciale, privato, insolito.<br><b>Esempi:</b> 1. Questa è una festa <b>pubblica</b> per tutti. 2. È una regola <b>generale</b> essere puntuali.",
            "zh": "<b>Kínverska (中文):</b><br><b>解释:</b> 适用于所有人的事物，公众的，或非常普遍的。 (形容词)<br><b>同义词:</b> 普遍的, 一般的, 公众的。<br><b>反义词:</b> 特殊的, 私人的。<br><b>例句:</b> 1. 这一天是所有人的<b>公共</b>假日。2. 准时是<b>一般</b>的规矩。",
            "ku": "<b>Kúrdíska (Kurdî):</b><br><b>Ravekirin:</b> Tiştekî ku ji bo hemû mirovan derbasdar e, an jî gelek asayî ye. (rengdêr)<br><b>Hevwate:</b> hevbeş, giştî.<br><b>Dijwate:</b> taybet, ne asayî.<br><b>Mînak:</b> 1. Ev betlaneyek <b>giştî</b> ye. 2. Di wextê xwe de hatin qaîdeyek <b>giştî</b> ye.",
            "lv": "<b>Lettneska (Latviešu):</b><br><b>Paskaidrojums:</b> Kaut kas, kas attiecas uz visiem cilvēkiem, publisks vai parasts. (īpašības vārds)<br><b>Sinonīmi:</b> parasts, vispārējs, publisks.<br><b>Antonīmi:</b> īpašs, privāts, neparasts.<br><b>Piemēri:</b> 1. Šī ir <b>publiska</b> brīvdiena visiem. 2. Tas ir <b>vispārējs</b> noteikums ierasties laikā.",
            "lt": "<b>Litháíska (Lietuvių):</b><br><b>Paaiškinimas:</b> Taikoma visiems žmonėms, vieša arba labai įprasta. (būdvardis)<br><b>Sinonimai:</b> bendras, viešas, įprastas.<br><b>Antonimai:</b> ypatingas, privatus, retas.<br><b>Pavyzdžiai:</b> 1. Tai <b>vieša</b> šventė visiems. 2. <b>Bendra</b> taisyklė yra ateiti laiku.",
            "no": "<b>Norska (Norsk):</b><br><b>Forklaring:</b> Noe som gjelder for alle mennesker, er for alle eller er veldig vanlig. (adjektiv)<br><b>Synonymer:</b> vanlig, allmenn, offentlig.<br><b>Antonymer:</b> spesiell, privat, uvanlig.<br><b>Eksempler:</b> 1. Dette er en <b>offentlig</b> fridag. 2. Det er en <b>generell</b> regel å møte presis.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b><br><b>توضیح:</b> چیزی که شامل همه مردم می‌شود، عمومی یا بسیار رایج. (صفت)<br><b>مترادف:</b> عمومی، رایج، کلی.<br><b>متضاد:</b> خاص، خصوصی.<br><b>مثال:</b> 1. این یک تعطیلات <b>عمومی</b> برای همه است. 2. به موقع آمدن یک قانون <b>کلی</b> است.</div>",
            "pt": "<b>Portúgalska (Português):</b><br><b>Explicação:</b> Algo que se aplica a todas as pessoas, é para todos ou é muito comum. (adjetivo)<br><b>Sinônimos:</b> comum, geral, público.<br><b>Antônimos:</b> especial, privado, incomum.<br><b>Exemplos:</b> 1. Este é um feriado <b>público</b>. 2. É uma regra <b>geral</b> chegar na hora.",
            "pt-BR": "<b>Portúgalska - Brasilía (Português - Brasil):</b><br><b>Explicação:</b> Algo que se aplica a todas as pessoas, é para todos ou é muito comum. (adjetivo)<br><b>Sinônimos:</b> comum, geral, público.<br><b>Antônimos:</b> especial, privado, incomum.<br><b>Exemplos:</b> 1. Este é um feriado <b>público</b>. 2. É uma regra <b>geral</b> chegar na hora.",
            "pl": "<b>Pólska (Polski):</b><br><b>Wyjaśnienie:</b> Coś, co dotyczy wszystkich ludzi, publiczne lub bardzo powszechne. (przymiotnik)<br><b>Synonimy:</b> powszechny, ogólny, publiczny.<br><b>Antonimy:</b> specjalny, prywatny, rzadki.<br><b>Przykłady:</b> 1. To jest <b>publiczne</b> święto. 2. <b>Ogólną</b> zasadą jest bycie na czas.",
            "ro": "<b>Rúmenska (Română):</b><br><b>Explicație:</b> Ceva care se aplică tuturor oamenilor, public sau foarte comun. (adjectiv)<br><b>Sinonime:</b> comun, general, public.<br><b>Antonime:</b> special, privat, neobișnuit.<br><b>Exemple:</b> 1. Aceasta este o sărbătoare <b>publică</b>. 2. Este o regulă <b>generală</b> să fii la timp.",
            "ru": "<b>Rússneska (Русский):</b><br><b>Объяснение:</b> То, что относится ко всем людям, общественное или очень обычное. (прилагательное)<br><b>Синонимы:</b> общий, всеобщий, публичный.<br><b>Антонимы:</b> особенный, частный, необычный.<br><b>Примеры:</b> 1. Это <b>общественный</b> праздник. 2. Это <b>общее</b> правило - приходить вовремя.",
            "es": "<b>Spænska (Español):</b><br><b>Explicación:</b> Algo que se aplica a todas las personas, es público o muy común. (adjetivo)<br><b>Sinónimos:</b> común, general, público.<br><b>Antónimos:</b> especial, privado, inusual.<br><b>Ejemplos:</b> 1. Este es un día festivo <b>público</b>. 2. Es una regla <b>general</b> llegar a tiempo.",
            "sv": "<b>Sænska (Svenska):</b><br><b>Förklaring:</b> Något som gäller alla människor, är offentligt eller mycket vanligt. (adjektiv)<br><b>Synonymer:</b> allmän, vanlig, offentlig.<br><b>Antonymer:</b> speciell, privat, ovanlig.<br><b>Exempel:</b> 1. Detta är en <b>allmän</b> helgdag för alla. 2. Det är en <b>allmän</b> regel att komma i tid.",

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Markorð - Lota 2 - A2.2</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="sq">Albanska – Shqip</option>
                <option value="ar">Arabíska – العربية</option>
                <option value="da">Danska – Dansk</option>
                <option value="et">Eistneska – Eesti</option>
                <option value="en" selected>Enska – English</option>
                <option value="tl">Filippseyska – Tagalog / Filipino</option>
                <option value="fr">Franska – Français</option>
                <option value="it">Ítalska – Italiano</option>
                <option value="zh">Kínverska – 中文</option>
                <option value="ku">Kúrdíska – Kurdî</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português (EU)</option>
                <option value="pt-BR">Portúgalska (Brasilía) – Português (BR)</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="es">Spænska – Español</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
                <option value="de">Þýska – Deutsch</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return;

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð - Lota 2 - A2.2', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>
